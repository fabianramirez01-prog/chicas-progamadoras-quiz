<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicas Programadoras Quiz — Anfitrión</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <img
      class="corner-logo"
      src="/logo.jpg"
      alt="Chicas Programadoras Club"
      width="80"
      height="80"
    />
    <div class="app">
      <h1>Chicas Programadoras Quiz — Anfitrión</h1>
      <div class="host-toolbar">
        <button id="resetBtn" class="btn-secondary btn-small hidden">
          ↺ Volver al inicio (lobby)
        </button>
        <button
          id="musicBtn"
          class="btn-secondary btn-small"
          aria-pressed="false"
          title="Música de fondo"
        >
          🔊 Música
        </button>
      </div>

      <!-- Lobby -->
      <section id="lobbyScreen" class="card center">
        <h2>Para unirse, abre en tu teléfono:</h2>
        <p class="join-url" id="joinUrl">cargando...</p>
        <p>Jugadores conectados: <strong id="playerCount">0</strong></p>
        <div class="player-chips" id="playerChips"></div>
        <br />
        <button id="startBtn" class="btn-full">Iniciar juego</button>
        <p id="hostStatus" class="status"></p>
      </section>

      <!-- Question -->
      <section id="questionScreen" class="card hidden">
        <div class="meta">
          <span id="qCounter"></span>
          <span id="answeredCount"></span>
        </div>
        <h2 class="question-text" id="qText"></h2>
        <div class="timer" id="qTimer"></div>
        <div class="answers" id="answers"></div>
        <br />
        <button id="revealBtn" class="btn-secondary btn-full">
          Mostrar respuesta
        </button>
      </section>

      <!-- Reveal -->
      <section id="revealScreen" class="card hidden">
        <h2 class="question-text" id="revealQText"></h2>
        <div class="answers" id="revealAnswers"></div>

        <!-- Stage 1: correct vs. incorrect summary bar graph -->
        <div id="revealSummary">
          <h3>¿Cómo les fue?</h3>
          <div class="result-bars" id="resultBars"></div>
        </div>

        <!-- Stage 2: current ranking + next button (shown after a delay) -->
        <div id="revealRanking" class="hidden">
          <h3 id="leaderboardTitle">Tabla de posiciones</h3>
          <ol class="leaderboard" id="leaderboard"></ol>
          <br />
          <button id="nextBtn" class="btn-full">Siguiente pregunta</button>
        </div>
      </section>

      <!-- End -->
      <section id="endScreen" class="card hidden center">
        <h2>🏆 Ganadoras</h2>
        <div class="podium" id="podium"></div>
        <details class="full-board">
          <summary>Ver tabla completa</summary>
          <ol class="leaderboard" id="finalBoard"></ol>
        </details>
        <br />
        <div class="end-actions">
          <button id="restartBtn" class="btn-full">Jugar de nuevo</button>
          <button id="closeBtn" class="btn-secondary btn-full">
            Cerrar juego
          </button>
        </div>
      </section>
    </div>

    <footer class="app-footer">By CP 2026 II - Mentors</footer>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/host.js"></script>
  </body>
</html>
